<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FireFront | Initial scene setup</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main id="app" aria-label="FireFront 3D scene">
      <canvas id="scene" aria-label="An orange cube on a green ground plane"></canvas>
      <header class="scene-label">
        <h1>FireFront</h1>
        <p>Initial scene setup</p>
      </header>
      <aside class="controls-panel" aria-labelledby="camera-controls-title">
        <h2 id="camera-controls-title">Camera controls</h2>
        <dl>
          <div><dt>Zoom</dt><dd>Mouse wheel</dd></div>
          <div><dt>Pan</dt><dd>Right-button drag</dd></div>
          <div><dt>Orbit</dt><dd>Middle-button drag</dd></div>
          <div><dt>Reset view</dt><dd><kbd>R</kbd> key</dd></div>
        </dl>
      </aside>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
